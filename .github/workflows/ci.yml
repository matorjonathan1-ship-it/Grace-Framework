name: Grace Framework CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake liburing-dev g++-13

    - name: Configure CMake
      run: |
        cmake -S . -B build -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_BUILD_TYPE=Release

    - name: Build Grace
      run: |
        cmake --build build --config Release

    - name: Verify Build
      run: |
        ls -R build
