<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Framework | Dev Server</title>
    <style>
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; 
        }
        .container {
            background: #1e293b;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #334155;
            min-width: 320px;
        }
        h1 { margin: 0 0 0.5rem 0; font-size: 1.5rem; color: #38bdf8; }
        .stat { margin: 0.5rem 0; font-size: 0.9rem; color: #94a3b8; }
        .tag {
            background: #0ea5e9;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Grace Framework <span class="tag">v1.0-alpha</span></h1>
        <div class="stat">Status: <span style="color: #4ade80;">Running</span></div>
        <div class="stat">Engine: io_uring (Asynchronous)</div>
        <div class="stat">Port: 8080</div>
        <div class="stat">Environment: Development</div>
    </div>
</body>
</html>
